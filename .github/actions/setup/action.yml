name: Set up Tyr
description: Install elan and the pinned Lean toolchain, then fetch pinned native dependencies.

runs:
  using: composite
  steps:
    - name: Install elan
      shell: bash
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Cache pinned Lean toolchain
      id: lean-cache
      uses: actions/cache@v4
      with:
        path: ~/.elan/toolchains
        key: lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

    - name: Install pinned Lean toolchain
      if: steps.lean-cache.outputs.cache-hit != 'true'
      shell: bash
      run: elan toolchain install "$(cat lean-toolchain)"

    - name: Select pinned Lean toolchain
      shell: bash
      run: elan default "$(cat lean-toolchain)"

    - name: Cache dependency wheels
      uses: actions/cache@v4
      with:
        path: external/.cache
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/wheels.lock') }}

    - name: Fetch pinned dependencies
      shell: bash
      run: deps/fetch.sh cpu
