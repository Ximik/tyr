name: PR title

# A squash merge uses the PR title as the commit subject on main, so it must
# follow the same `type(scope): summary` format as commit subjects.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title format
        env:
          # Passed through env, not interpolated into the script: the title is
          # user-controlled text.
          TITLE: ${{ github.event.pull_request.title }}
        run: ./.githooks/check-commit-message.sh "$TITLE"
