name: PR

# Checks that the PR title and every commit subject follow `type(scope): summary`.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title format
        env:
          # Passed through env, not interpolated into the script: the title is
          # user-controlled text.
          TITLE: ${{ github.event.pull_request.title }}
        run: ./.githooks/check-commit-message.sh "$TITLE"

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subject format
        run: |
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          echo "Validating commit subjects in ${range}"
          invalid=0
          while IFS= read -r subject; do
            ./.githooks/check-commit-message.sh "${subject}" || invalid=1
          done < <(git log --reverse --format=%s "${range}")
          exit "${invalid}"
