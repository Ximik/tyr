name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: |
          git submodule update --init --depth 1 external/soxr

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Set up Lean toolchain
        run: |
          elan toolchain install $(cat lean-toolchain)
          elan default $(cat lean-toolchain)

      - name: Cache dependency wheels
        uses: actions/cache@v4
        with:
          path: external/.cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock') }}

      - name: Fetch pinned native dependencies
        run: ./fetch_dependencies.sh

      - name: Prepare doc-gen4 path dependency
        run: |
          rm -rf "$GITHUB_WORKSPACE/../doc-gen4"
          git clone --depth 1 https://github.com/cpehle/doc-gen4.git "$GITHUB_WORKSPACE/../doc-gen4"
          cd "$GITHUB_WORKSPACE/../doc-gen4"
          lake update BibtexQuery
          python3 - <<PY
          from pathlib import Path

          path = Path("DocGen4/Output/Bibtex.lean")
          source = path.read_text()
          block = r"""
          namespace BibtexXml

          def attrsToStringEscaped (as : BibtexQuery.Xml.Attributes) : String :=
            as.foldl (init := "") fun acc k v => acc ++ s!" {k}=\"{Html.escape v}\""

          mutual

          partial def eToStringEscaped : BibtexQuery.Xml.Element -> String
            | .Element n a c =>
                let inner := c.map cToStringEscaped |>.foldl (fun acc x => acc ++ x) ""
                s!"<{n}{attrsToStringEscaped a}>{inner}</{n}>"

          partial def cToStringEscaped : BibtexQuery.Xml.Content -> String
            | .Element e => eToStringEscaped e
            | .Comment c => s!"<!--{c}-->"
            | .Character c => Html.escape c

          end

          mutual

          partial def eToPlaintext : BibtexQuery.Xml.Element -> String
            | .Element _ _ c => c.map cToPlaintext |>.foldl (fun acc x => acc ++ x) ""

          partial def cToPlaintext : BibtexQuery.Xml.Content -> String
            | .Element e => eToPlaintext e
            | .Comment _ => ""
            | .Character c => c

          end

          end BibtexXml
          """
          source = source.replace(
              "namespace DocGen4.Bibtex\n\n",
              "namespace DocGen4.Bibtex\n" + block + "\n",
              1,
          )
          source = source.replace(
              "html := html.map cToStringEscaped |>.toList |> String.join",
              "html := html.map BibtexXml.cToStringEscaped |>.toList |> String.join",
          )
          source = source.replace(
              "plaintext := html.map cToPlaintext |>.toList |> String.join",
              "plaintext := html.map BibtexXml.cToPlaintext |>.toList |> String.join",
          )
          path.write_text(source)
          PY

      - name: Create docbuild package
        run: |
          mkdir -p docbuild
          cp lean-toolchain docbuild/lean-toolchain
          ln -sfn ../external docbuild/external
          ln -sfn ../cc docbuild/cc
          ln -sfn ../docs docbuild/docs
          cat > docbuild/lakefile.toml <<'EOF'
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          srcDir = "."
          packagesDir = "../.lake/packages"

          [[require]]
          name = "tyr"
          path = "../"

          [[require]]
          name = "doc-gen4"
          path = "../../doc-gen4"
          EOF

      - name: Build docs
        run: |
          lean_prefix="$(lean --print-prefix)"
          multiarch_dir="/usr/lib/$(gcc -print-multiarch)"
          gomp_dir="$(dirname "$(gcc -print-file-name=libgomp.so)")"
          export LEAN_CC="$GITHUB_WORKSPACE/scripts/lean_cc_wrapper.sh"
          export LEAN_CC_GCC="/usr/bin/gcc"
          export LIBRARY_PATH="${multiarch_dir}:${gomp_dir}:/usr/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/external/libtorch/lib:${lean_prefix}/lib:${lean_prefix}/lib/glibc:${multiarch_dir}:${gomp_dir}:/usr/lib:${LD_LIBRARY_PATH:-}"
          cd docbuild
          lake build Tyr:docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
