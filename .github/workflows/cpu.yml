name: CPU

# Builds Tyr and runs the CPU test suites on Linux and macOS;
# `tooling` tests the repo's Python and shell scripts.

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore compiled-output caches for this run
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    env:
      TYR_CI_CLEAN: ${{ github.event_name == 'push' || inputs.clean_build }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean and dependencies
        uses: ./.github/actions/setup

      - name: Compute binary compatibility keys
        id: cache-key
        run: |
          python3 .github/scripts/cache_key.py --output output/ci/cache-identity.json >> "$GITHUB_OUTPUT"

      - name: Restore compatible dependency builds
        id: dependency-cache
        if: env.TYR_CI_CLEAN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: ${{ steps.cache-key.outputs.dependencies }}

      - name: Restore compatible project and native builds
        id: build-cache
        if: env.TYR_CI_CLEAN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            cc/build
            cc/src/generated
          key: ${{ steps.cache-key.outputs.build }}
          restore-keys: ${{ steps.cache-key.outputs.build_prefix }}

      - name: Build required test runners
        run: |
          python3 scripts/test_inventory.py --build --wfail

      - name: Verify audited FFI ABI declarations
        run: |
          python3 scripts/check_ffi_abi.py
          python3 scripts/check_ffi_abi.py --header cc/src/tyr_owned_kv_abi.h --generated .lake/build/ir/Tyr/Inference/OwnedKV.c

      - name: Test native attention CPU semantics
        run: |
          bash scripts/test_native_attention.sh cpu

      - name: Build examples and FFI probe
        run: |
          lake build --wfail Examples BranchingFlowsMoleculeTrainGenerate mctx_bench ffi_crash_probe
          lake env lean Examples/BranchingFlows/BranchingFlowsDemo.lean

      - name: Check FFI crash reporting
        if: runner.os == 'Linux'
        run: .github/scripts/check_ffi_crash_probe.sh

      - name: Check no library replaces another library's code
        if: runner.os == 'Linux'
        run: .github/scripts/check_symbol_overlap.sh

      - name: Save compatible dependency builds
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: ${{ steps.cache-key.outputs.dependencies }}

      - name: Save validated project and native builds
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            cc/build
            cc/src/generated
          key: ${{ steps.cache-key.outputs.build }}

      - name: Run required CPU test suites
        run: |
          lake env python3 scripts/test_inventory.py --run --report output/ci/suites.json
          lake env python3 scripts/test_branching_checkpoint_resume.py
          lake env ./.lake/build/bin/mctx_bench

      - name: Upload CPU test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: output/ci/
          if-no-files-found: warn
          retention-days: 14

  tooling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install NumPy for the parity wrapper test
        run: |
          python3 -m venv "$RUNNER_TEMP/qualification-tests"
          numpy_version=$(python3 -c 'import json; print(json.load(open("scripts/qualification/fixtures.json"))["python_packages"]["numpy"])')
          "$RUNNER_TEMP/qualification-tests/bin/python" -m pip install --disable-pip-version-check "numpy==$numpy_version"

      - name: Run tooling tests
        run: |
          python3 scripts/test_inventory.py
          python3 scripts/test_test_inventory.py
          python3 .github/scripts/test_cache_key.py
          python3 .github/scripts/test_readiness.py
          python3 scripts/qualification/test_qualification.py
          python3 scripts/test_qwen3tts_asr_wrapper.py
          "$RUNNER_TEMP/qualification-tests/bin/python" scripts/test_qwen3tts_parity_wrapper.py
          python3 scripts/test_native_build.py
          python3 scripts/test_branching_checkpoint_snapshot.py
          bash scripts/nanochat/test_checkpoint_paths.sh
