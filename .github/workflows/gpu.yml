name: GPU

# Builds the CUDA kernels and runs GPU qualification on the self-hosted runner.
# See docs/ci-and-qualification.md.
on:
  push:
    branches: [main]
    paths: &gpu-paths
      - 'Tyr/GPU/**'
      - 'Tyr/Torch.lean'
      - 'Tests/*GPU*.lean'
      - 'Examples/GPU/**'
      - 'Examples/NanoChat/Generator/KVCache.lean'
      - 'Tyr/Inference/**'
      - 'Tyr/Model/Laguna/**'
      - 'Tests/RunLagunaModel.lean'
      - 'scripts/qualification/**'
      - '.github/scripts/readiness.py'
      - 'env.sh'
      - 'deps/**'
      - 'scripts/test_native_attention.sh'
      - 'scripts/gpu/**'
      - 'cc/include/**'
      - 'cc/tools/**'
      - 'cc/src/tyr*'
      - 'cc/src/tk_*'
      - 'cc/src/generated/**'
      - 'cc/Makefile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/gpu.yml'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths: *gpu-paths
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      real_models:
        description: Run pinned Qwen tokenizer parity and TTS/ASR qualification
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-runner:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: ubuntu-latest
    outputs:
      runner_labels: ${{ steps.configuration.outputs.runner_labels }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository runner configuration
        id: configuration
        env:
          TYR_QUALIFICATION_RUNNER_LABELS: ${{ vars.TYR_QUALIFICATION_RUNNER_LABELS }}
        run: python3 .github/scripts/readiness.py
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-readiness-${{ github.run_attempt }}
          path: output/qualification/readiness.json
          retention-days: 14

  qualify:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 180
    env:
      GPU: ${{ vars.TYR_GPU || 'GB10' }}
      TYR_QUALIFICATION_ROOT: ${{ vars.TYR_QUALIFICATION_ROOT }}
      TYR_QUALIFICATION_BOOTSTRAP_PYTHON: ${{ vars.TYR_QUALIFICATION_BOOTSTRAP_PYTHON || 'python3.12' }}
      TYR_QUALIFY_MODELS: ${{ github.event_name == 'schedule' || inputs.real_models }}
      CUDA_HOME: ${{ vars.TYR_CUDA_HOME || '/usr/local/cuda' }}
    steps:
      - uses: actions/checkout@v4
      - name: Default qualification root
        run: echo "TYR_QUALIFICATION_ROOT=${TYR_QUALIFICATION_ROOT:-$HOME/tyr-qualification}" >> "$GITHUB_ENV"
      - name: Install pinned Lean toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null; then
            echo 'The qualification runner must have elan installed.' >&2
            exit 1
          fi
          toolchain="$(cat lean-toolchain)"
          if ! elan toolchain list | grep -Fxq "$toolchain"; then elan toolchain install "$toolchain"; fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies (CUDA)
        run: TYR_DEPS_VARIANT=cuda TYR_DEPS_CACHE="$TYR_QUALIFICATION_ROOT/wheel-cache" deps/fetch.sh
      - name: Build and run strict qualification with exclusive GPU access
        run: |
          mkdir -p "$TYR_QUALIFICATION_ROOT"
          flock --timeout 3600 "$TYR_QUALIFICATION_ROOT/gpu.lock" bash scripts/qualification/job.sh
      - name: Require executed qualification reports
        if: always()
        run: |
          reports=(gpu)
          if [[ "$TYR_QUALIFY_MODELS" == true ]]; then reports+=(models); fi
          python3 scripts/qualification/summarize.py --directory output/qualification "${reports[@]}"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ runner.name }}-${{ github.run_attempt }}
          path: output/qualification/
          if-no-files-found: error
          retention-days: 30
