name: CI

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore compiled-output caches for this run
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    env:
      # Main remains a clean project/dependency/native compilation gate.
      TYR_CI_CLEAN: ${{ github.event_name == 'push' || inputs.clean_build }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init --depth 1 external/soxr

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache pinned Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Set up Lean toolchain
        run: |
          toolchain="$(cat lean-toolchain)"
          if ! elan toolchain list | grep -Fxq "$toolchain"; then
            elan toolchain install "$toolchain"
          fi
          elan default "$toolchain"

      - name: Cache dependency wheels
        uses: actions/cache@v4
        with:
          path: external/.cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock') }}

      - name: Fetch pinned native dependencies
        run: ./fetch_dependencies.sh

      - name: Compute binary compatibility keys
        id: cache-key
        run: |
          source scripts/ci/environment.sh
          python3 scripts/ci/cache_key.py --output output/ci/cache-identity.json >> "$GITHUB_OUTPUT"

      - name: Restore compatible dependency builds
        id: dependency-cache
        if: env.TYR_CI_CLEAN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: ${{ steps.cache-key.outputs.dependencies }}

      - name: Restore compatible project and native builds
        id: build-cache
        if: env.TYR_CI_CLEAN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            cc/build
            cc/src/generated
          key: ${{ steps.cache-key.outputs.build }}
          restore-keys: ${{ steps.cache-key.outputs.build_prefix }}

      # A cache hit never bypasses Lake/Make's dependency checks or the ABI gate.
      - name: Build required test runners
        run: |
          source scripts/ci/environment.sh
          python3 scripts/test_inventory.py --build

      - name: Verify audited FFI ABI declarations
        run: |
          python3 scripts/check_ffi_abi.py
          python3 scripts/check_ffi_abi.py --header cc/src/tyr_owned_kv_abi.h --generated .lake/build/ir/Tyr/Inference/OwnedKV.c

      - name: Test native attention CPU semantics
        run: |
          source scripts/ci/environment.sh
          bash scripts/test_native_attention.sh cpu

      - name: Typecheck required example surfaces
        run: |
          source scripts/ci/environment.sh
          lake -R build Examples BranchingFlowsMoleculeTrainGenerate mctx_bench
          lake -R env lean Examples/NanoChat/Generator/TypedState.lean
          lake -R env lean Examples/BranchingFlows/BranchingFlowsDemo.lean

      # Save before tests: retrying a failed CPU suite can reuse its successful
      # build, even when the preceding workflow's test step failed.
      - name: Save compatible dependency builds
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: ${{ steps.cache-key.outputs.dependencies }}

      - name: Save validated project and native builds
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            cc/build
            cc/src/generated
          key: ${{ steps.cache-key.outputs.build }}

      - name: Run required CPU test suites
        run: |
          source scripts/ci/environment.sh
          lake -R env python3 scripts/test_inventory.py --run --report output/ci/suites.json
          lake -R env python3 scripts/test_branching_checkpoint_resume.py
          lake -R env ./.lake/build/bin/mctx_bench

      - name: Upload CPU test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: output/ci/
          if-no-files-found: warn
          retention-days: 14

      # Real-model Qwen tests are provisioned and required in cuda-smoke.yml's
      # scheduled/manual qualification tier, rather than silently skipped here.

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subject format
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          echo "Validating commit subjects in ${range}"
          invalid=0
          while IFS= read -r subject; do
            ./.githooks/check-commit-message.sh "${subject}" || invalid=1
          done < <(git log --reverse --format=%s "${range}")
          exit "${invalid}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare tokenizer parity regression dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/qualification-tests"
          numpy_version=$(python3 -c 'import json; print(json.load(open("scripts/qualification/fixtures.json"))["python_packages"]["numpy"])')
          "$RUNNER_TEMP/qualification-tests/bin/python" -m pip install --disable-pip-version-check "numpy==$numpy_version"

      - name: Check test routing and native build dependencies
        run: |
          python3 scripts/test_inventory.py
          python3 scripts/test_test_inventory.py
          python3 scripts/ci/test_cache_key.py
          python3 scripts/qualification/test_qualification.py
          python3 scripts/test_qwen3tts_asr_wrapper.py
          "$RUNNER_TEMP/qualification-tests/bin/python" scripts/test_qwen3tts_parity_wrapper.py
          python3 scripts/test_native_build.py
          python3 scripts/test_branching_checkpoint_snapshot.py
          bash scripts/nanochat/test_checkpoint_paths.sh

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          if rg -n "(--|/-).*\\b(TODO|FIXME)\\b" Tyr/ Examples/ Tests/ -g "*.lean"; then
            echo "Found TODO/FIXME comments in Lean sources"
          else
            echo "No TODO/FIXME found"
          fi

      - name: Check for sorry
        run: |
          echo "Checking for sorry (incomplete proofs)..."
          if rg -n "\\bsorry\\b" Tyr/ Examples/ Tests/ -g "*.lean" -g "!Tyr/Tokenizer/SpecialTokens.lean"; then
            echo "Found sorry in Lean sources"
          else
            echo "No sorry found"
          fi
