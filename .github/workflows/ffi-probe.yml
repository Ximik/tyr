name: Linux FFI probe

# Diagnostic workflow for the libc++abi/libstdc++ dual-runtime question
# (see the background comment in cc/src/tyr.cpp): runs the intentional
# crash probe on Linux to characterize how an uncaught libtorch exception
# actually dies under the gcc/libstdc++ toolchain, and audits which C++
# runtime/unwinder symbols the Lean toolchain exports to the dynamic
# symbol table (the suspected interposition mechanism).
#
# Informational: the probe step records the death message and exit code
# but does not fail the workflow on either outcome.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cc/src/tyr.cpp'
      - 'Tests/FfiCrashProbe.lean'
      - '.github/workflows/ffi-probe.yml'

jobs:
  ffi-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init --depth 1 external/soxr

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Set up Lean toolchain
        run: |
          elan toolchain install $(cat lean-toolchain)
          elan default $(cat lean-toolchain)

      - name: Cache dependency wheels
        uses: actions/cache@v4
        with:
          path: external/.cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.lock') }}

      - name: Fetch pinned native dependencies
        run: ./fetch_dependencies.sh

      - name: Build crash probe
        run: |
          lean_prefix="$(lean --print-prefix)"
          multiarch_dir="/usr/lib/$(gcc -print-multiarch)"
          gomp_dir="$(dirname "$(gcc -print-file-name=libgomp.so)")"
          export LEAN_CC="$PWD/scripts/lean_cc_wrapper.sh"
          export LEAN_CC_GCC="/usr/bin/gcc"
          export LIBRARY_PATH="${multiarch_dir}:${gomp_dir}:/usr/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="$PWD/external/libtorch/lib:${lean_prefix}/lib:${lean_prefix}/lib/glibc:${multiarch_dir}:${gomp_dir}:/usr/lib:${LD_LIBRARY_PATH:-}"
          lake -R build ffi_crash_probe

      - name: Audit dynamic symbol exports (interposition diagnostics)
        run: |
          lean_prefix="$(lean --print-prefix)"
          echo "=== EH/runtime symbols EXPORTED by the probe executable ==="
          nm -D ./.lake/build/bin/ffi_crash_probe 2>/dev/null \
            | grep -E "__cxa_throw|__cxa_begin_catch|__cxa_allocate_exception|__gxx_personality_v0|_Unwind_RaiseException|_ZSt13set_terminate" \
            || echo "(none exported — no interposition from the executable)"
          echo
          echo "=== EH/runtime symbols EXPORTED by libleanshared.so ==="
          for lib in "${lean_prefix}"/lib/lean/libleanshared*.so; do
            echo "--- ${lib}"
            nm -D "$lib" 2>/dev/null \
              | grep -E "__cxa_throw|__cxa_begin_catch|__cxa_allocate_exception|__gxx_personality_v0|_Unwind_RaiseException|_ZSt13set_terminate" \
              || echo "(none exported)"
          done
          echo
          echo "=== Dynamic dependencies of the probe ==="
          ldd ./.lake/build/bin/ffi_crash_probe | grep -E "stdc\+\+|gcc_s|torch|c10" || true

      - name: Run crash probe (informational)
        run: |
          lean_prefix="$(lean --print-prefix)"
          multiarch_dir="/usr/lib/$(gcc -print-multiarch)"
          gomp_dir="$(dirname "$(gcc -print-file-name=libgomp.so)")"
          export LD_LIBRARY_PATH="$PWD/external/libtorch/lib:${lean_prefix}/lib:${lean_prefix}/lib/glibc:${multiarch_dir}:${gomp_dir}:/usr/lib:${LD_LIBRARY_PATH:-}"
          set +e
          ./.lake/build/bin/ffi_crash_probe
          code=$?
          set -e
          echo
          echo "=== probe exited with code ${code} ==="
          echo "134 = SIGABRT (terminate handler ran), 139 = SIGSEGV,"
          echo "0 = CUDA transfer unexpectedly succeeded."
